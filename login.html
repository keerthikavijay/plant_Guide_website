<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Growing Guide | Login</title>
    <meta name="description" content="Login to your PlantGuide account.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">🌿 <span>PlantGuide</span></div>
            <button class="nav-toggle" id="nav-toggle">☰</button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="plants.html">Plants</a></li>
                <li><a href="favorite.html">Favorite</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-container">
        <div class="form-container">
            <h2>Welcome Back</h2>
            <div id="login-feedback" class="feedback-msg"></div>
            <form id="login-form" novalidate>
                <div class="form-group" id="group-username">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username">
                    <div class="error-msg">Username is required.</div>
                </div>
                <div class="form-group" id="group-password">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <div class="error-msg">Password must be at least 6 characters long.</div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PlantGuide. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
